name: Monthly executive decks

# Runs on the 1st of each month 06:00 UTC, and can also be triggered manually
# from the Actions tab (workflow_dispatch) for testing.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

# Needed so the auto-commit step can push the generated decks back to the repo.
permissions:
  contents: write

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # This job builds .pptx decks, so it needs Node/pptxgenjs as well.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm install

      - name: Generate monthly decks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_monthly_report.py

      # Commit the generated decks. They are binary .pptx files — committed
      # as-is, never diffed or merged.
      - name: Commit and push generated decks
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: monthly executive decks [skip ci]'
          file_pattern: 'reports/decks/**'
